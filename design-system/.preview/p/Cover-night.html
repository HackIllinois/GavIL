<script src="/components/bundle.js"></script><meta charset="utf-8"><title>Cover</title>
<style>
  html,body{margin:0;background:var(--ground)}
  /* The 2027 canyon (art-ground: the sunset painting at Sunset, the night painting at Night) under a plum band that carries the
     white lockup (a white mark goes on the ground band, never on the painting), a wooden sign with the name, the real signpost to
     the rounds, a table placard, a sheriff star and Table talk's sign. The scene is a fixed 960 x 340 illustration canvas: shape
     positions and sizes are drawing coordinates, not UI spacing. Type, color, shadows and padding all come from tokens. */
  .cv{position:relative;width:960px;height:340px;overflow:hidden;background:var(--art-ground) 50% 22%/cover no-repeat,var(--ground)}
  [data-theme="night"] .cv::before{content:"";position:absolute;inset:0;background:var(--scrim)}
  .cv__band{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-8);background:var(--ground-deep);color:var(--on-ground-soft);box-shadow:var(--shadow-plank-edge)}
  .cv__band span{font:var(--type-caps);letter-spacing:calc(var(--tracking-eyebrow) * 2);text-transform:uppercase}
  .cv__band .cv__name2{font:var(--type-title);font-family:var(--font-western);letter-spacing:var(--tracking-title);text-transform:none;color:var(--on-ground)}
  .cv__band .gv-brand{height:calc(var(--mark-h) - var(--space-2))}
  /* The sign: the real plank (art-plank-flat) as a 3-slice, so its chamfered ends keep their cut at 500 x 188. */
  .cv__sign{--h:188px;--cap:calc(var(--h) * var(--plank-cap-flat) / var(--plank-art-h));position:absolute;left:40px;top:88px;width:500px;height:var(--h);box-sizing:border-box;padding:var(--space-5) var(--space-12) var(--space-4);border:0 solid transparent;border-image:var(--art-plank-flat) 0 var(--plank-cap-flat) fill / 0 var(--cap) stretch;color:var(--on-wood);text-align:center}
  /* The plank-scrim, as under every wood button: a veil above the plank's art and under its lettering (isolation keeps it from slipping behind the
     art), full strength between the end caps and fading to nothing across each cap. Without it the cream lands on the grain's gold highlights
     (3.1:1 at the first percentile, 2.4:1 at the worst pixel); the suite measures both planks on the real pixels in both themes. */
  .cv__sign,.cv__rec{isolation:isolate}
  .cv__sign::after,.cv__rec::after{content:"";position:absolute;z-index:-1;inset:var(--stroke) 0;background:var(--plank-scrim);pointer-events:none;
    -webkit-mask-image:linear-gradient(90deg,transparent,var(--wood-deep) var(--cap),var(--wood-deep) calc(100% - var(--cap)),transparent);mask-image:linear-gradient(90deg,transparent,var(--wood-deep) var(--cap),var(--wood-deep) calc(100% - var(--cap)),transparent)}
  .cv__k{font:var(--type-caps);letter-spacing:calc(var(--tracking-eyebrow) * 2);text-transform:uppercase;color:var(--on-wood)}
  /* The cover's sign name is illustration scale (twice display-lg): its own type token, cover-name, used only here. */
  .cv__name{font:var(--type-cover-name);margin:var(--space-1) 0 var(--space-2);color:var(--on-wood);text-shadow:0 calc(var(--space-1) + var(--stroke-hair)) 0 var(--wood-deep)}
  .cv__tag{font:var(--type-body-sm);font-family:var(--font-western);font-weight:400;letter-spacing:var(--tracking-caps);color:var(--on-wood);margin:0}
  /* The signpost (art-signpost, 718 x 1135) at 252 high, lettered with live text on its five signs. */
  .cv__post{position:absolute;left:742px;top:72px;width:159px;height:252px;background:var(--art-signpost) 50% 50%/contain no-repeat;filter:drop-shadow(var(--shadow-star))}
  .cv__s{position:absolute;display:flex;align-items:center;justify-content:center;margin:0;color:var(--ink-sign);font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;text-align:center;white-space:nowrap}
  .cv__s--1{left:8%;top:3%;width:84%;height:14%;transform:rotate(1.8deg)}
  .cv__s--2{left:30%;top:22%;width:52%;height:12%;transform:rotate(-3.6deg)}
  .cv__s--3{left:21%;top:37%;width:68%;height:14.5%;transform:rotate(2.5deg)}
  .cv__s--4{left:24%;top:57%;width:62%;height:12.5%;transform:rotate(-6.3deg)}
  /* The teal character stands beside the sign; the longhorn sits on a paper seal. */
  .cv__char{position:absolute;left:592px;top:186px;width:150px;height:150px;background:var(--art-character-teal) 50% 50%/contain no-repeat}
  .cv__seal{position:absolute;left:6px;top:64px;margin:0}
  .cv .gv-star{position:absolute;left:520px;top:248px;margin:0;width:70px;height:70px;animation:none}
  /* A table placard on the mesa: the room band, the code, the QR of the table (the right-table check). */
  .cv__tent{position:absolute;left:44px;top:262px;width:104px;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 var(--stroke) var(--ink),var(--shadow-plank)}
  .cv__tent-band{padding:var(--space-1) var(--space-2);background:var(--room-a);color:var(--on-room-a);font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase}
  .cv__tent-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-1);padding:var(--space-1) var(--space-2) var(--space-2)}
  .cv__tent-code{font:var(--type-title);letter-spacing:var(--tracking-title)}
  .cv__tent-qr{width:var(--space-8);height:var(--space-8)}
  .cv__tent-qr svg{display:block;width:100%;height:100%}
  /* Table talk: a recording dot and the word, on a small plank by the star (always the word, never the dot alone). */
  .cv__rec{--h:40px;--cap:calc(var(--h) * var(--plank-cap-flat) / var(--plank-art-h));position:absolute;left:176px;top:284px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-6);min-height:var(--h);border:0 solid transparent;border-image:var(--art-plank-flat) 0 var(--plank-cap-flat) fill / 0 var(--cap) stretch;color:var(--on-wood);font:var(--type-caps);letter-spacing:var(--tracking-caps);text-transform:uppercase}
  .cv__rec::before{content:"";width:var(--space-3);height:var(--space-3);border-radius:50%;background:var(--rec);box-shadow:0 0 0 var(--space-1) var(--rec-ring)}
  /* Night: the neon marquee (art-neon-board) carries the name; the day sign gives way to it. */
  .cv__neon{position:absolute;left:30px;top:64px;width:468px;height:274px;display:none;background:var(--art-neon-board) 50% 50%/contain no-repeat}
  [data-theme="night"] .cv__neon{display:block}
  [data-theme="night"] .cv__sign{display:none}
</style></head>

  <div class="gv-star"></div>
  <div class="cv__tent" aria-hidden="true"><div class="cv__tent-band">Room 4217</div><div class="cv__tent-row"><span class="cv__tent-code">A12</span><span class="cv__tent-qr" id="cv-qr"></span></div></div>

</div>
<script>
  // The placard QR encodes the table (https://judging.hackillinois.org/t/A12), never the project. The lockup is the real art.
  (function(){
    var G=window.GavIL, el=document.getElementById('cv-qr'), lk=document.getElementById('cv-lockup'), sl=document.getElementById('cv-seal');
    if(el&&G&&window.ReactDOM) ReactDOM.createRoot(el).render(React.createElement(G.QR,{value:G.placardUrl('A12'),label:'Placard QR'}));
    if(lk&&G&&window.ReactDOM) ReactDOM.createRoot(lk).render(React.createElement(G.Brand,{name:'lockup'}));
    if(sl&&G&&window.ReactDOM) ReactDOM.createRoot(sl).render(React.createElement(G.Brand,{name:'longhorn'}));
  })();
</script>
