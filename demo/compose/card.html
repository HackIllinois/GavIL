<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Backdrops for the narrated demo video (1920x1080). Brand art comes from design-system/assets/brand, never redrawn.
     ?kind=intro | judge | admin | outro. Rendered to PNG by render-cards.mjs; compose.sh lays the recordings on top. -->
<link rel="stylesheet" href="../../design-system/.preview/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Oswald:wght@500&family=Ultra&display=swap">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
  body{position:relative;background:var(--ground) center/cover no-repeat;color:var(--on-ground,#fff);font:var(--type-body)}
  body.sunset{background-image:url(../../design-system/assets/brand/bg-sunset.png)}
  body.night{background-image:url(../../design-system/assets/brand/bg-night.png)}
  .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,18,40,.72),rgba(28,18,40,.18) 60%,rgba(28,18,40,0))}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
  .lockup{height:120px}
  .name{font-family:Ultra,serif;font-size:200px;line-height:1;letter-spacing:.02em;text-shadow:0 6px 0 rgba(40,20,50,.55),0 0 40px rgba(0,0,0,.35)}
  .sub{font-family:Oswald,sans-serif;font-weight:500;font-size:46px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.5)}
  .side{position:absolute;left:150px;top:0;bottom:0;width:760px;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .eyebrow{font-family:Oswald,sans-serif;font-weight:500;font-size:34px;letter-spacing:.14em;text-transform:uppercase;color:#ffd27a}
  .title{font-family:Ultra,serif;font-size:84px;line-height:1.05;text-shadow:0 5px 0 rgba(40,20,50,.5)}
  .lede{font-family:Manrope,sans-serif;font-weight:500;font-size:34px;line-height:1.4;max-width:680px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .phone{position:absolute;left:1180px;top:30px;width:470px;height:1020px;border-radius:52px;background:#120c18;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.08)}
  .top{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;justify-content:center;gap:24px}
  .top .eyebrow{font-size:30px;color:#fff}
  .top img{height:40px}
  .frame{position:absolute;left:184px;top:96px;width:1552px;height:970px;border-radius:18px;background:#120c18;box-shadow:0 30px 80px rgba(0,0,0,.5)}
</style></head>
<body>
<script>
const k = new URLSearchParams(location.search).get('kind') || 'intro'
const B = '../../design-system/assets/brand/'
const html = {
  intro: `<div class="center"><img class="lockup" src="${B}hackillinois-lockup.svg" alt=""><div class="name">GAV-IL</div><div class="sub">Judging for HackIllinois 2027</div></div>`,
  outro: `<div class="center"><img class="lockup" src="${B}hackillinois-lockup.svg" alt=""><div class="name">GAV-IL</div><div class="sub">Fair, fast judging · built for HackIllinois 2027</div></div>`,
  judge: `<div class="veil"></div><div class="side"><div class="eyebrow">Judge app</div><div class="title">On a phone, one hand, a loud room.</div><div class="lede">Check in, find the right table, evaluate with the team's consent, compare, nominate.</div></div><div class="phone"></div>`,
  admin: `<div class="top"><img src="${B}h-mark.svg" alt=""><div class="eyebrow">Admin console</div></div><div class="frame"></div>`,
}[k]
document.body.className = (k === 'admin' || k === 'outro') ? 'night' : 'sunset'
document.body.insertAdjacentHTML('beforeend', html)
</script>
</body></html>
