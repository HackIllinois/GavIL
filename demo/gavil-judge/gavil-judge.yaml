app:
  url: "http://localhost:3190/login"
  viewport:
    width: 390
    height: 844
  scale: 1
  zoom: 1
  colorScheme: "light"
  setup:
    - run: "demo/ndemo-reset.sh web 3190"
tts:
  provider: "openai"
  voice: "en-US-AndrewNeural"
  speed: 1.05
recording:
  outputDir: "."
  fps: 30
segments:
  - id: "lead"
    intent: "hold the login screen for half a second before the voice starts"
    actions:
      - type: "wait"
        duration: 500
    timing: "parallel"
    audioDuration: 0
    videoDuration: 501
  - id: "sign-in-email"
    narration: "This is Gav-IL, the judging app for HackIllinois 2027. A judge types their email, and gets a one-time code. No passwords."
    intent: "show the login screen while the first sentence plays (1.9 s), then type the judge's email as the second sentence starts (A judge types their email at 4.4 s), ask for the sign-in link as No passwords is said"
    actions:
      - type: "wait"
        duration: 1900
      - type: "type"
        target:
          role: "textbox"
          name: "Email"
        text: "sarah.kim@stripe.com"
        delay: 90
      - type: "wait"
        duration: 500
      - type: "click"
        target:
          role: "button"
          name: "Email me a sign-in link"
        done:
          text:
            selector: "main"
            has: "Link sent to sarah.kim@stripe.com"
          timeout: 60000
      - type: "wait"
        duration: 600
    timing: "parallel"
    audioDuration: 8592
    videoDuration: 8594
  - id: "sign-in-code"
    narration: "They type the six-digit code from the email, and tap Sign in."
    intent: "enter the mock code 123456 and tap Sign in with code"
    actions:
      - type: "type"
        target:
          role: "textbox"
          name: "6-digit code"
        text: "123456"
        delay: 120
      - type: "wait"
        duration: 150
      - type: "click"
        target:
          role: "button"
          name: "Sign in with code"
    timing: "parallel"
    audioDuration: 3432
    videoDuration: 3470
  - id: "to-welcome"
    intent: "wait for the check-in screen (silent: the page load, and the Signing in state, are cut or kept short)"
    actions:
      - type: "press"
        key: "Shift"
        done:
          text:
            selector: "main"
            has: "Welcome, Sarah"
          timeout: 60000
      - type: "wait"
        duration: 300
    timing: "parallel"
    audioDuration: 0
    videoDuration: 720
  - id: "enter"
    narration: "And they are signed in."
    intent: "the check-in screen is on screen"
    actions:
      - type: "wait"
        duration: 1300
    timing: "parallel"
    audioDuration: 1176
    videoDuration: 1302
  - id: "check-in"
    narration: "Then check-in shows each judge who they are, which Path they judge, and the teams they won't be sent to."
    intent: "the check-in screen: identity, path, room, the conflicts list"
    actions:
      - type: "wait"
        duration: 2200
      - type: "scroll"
        target:
          selector: "text=/be sent to/"
      - type: "wait"
        duration: 1800
    timing: "parallel"
    audioDuration: 5592
    videoDuration: 5595
  - id: "how-tonight"
    narration: "Below that, a short guide to how tonight works."
    intent: "scroll down to how tonight works"
    actions:
      - type: "scroll"
        target:
          text: "Nominate standouts for prizes as you go"
      - type: "wait"
        duration: 1800
    timing: "parallel"
    audioDuration: 2880
    videoDuration: 2882
  - id: "looks-right"
    narration: "Looks right sends the judge to their room."
    intent: "tap Looks right once the line is spoken (the page load that follows is silent, so postcut.mjs can cut its skeleton and blank frames); the load is waited out in the next (silent) segment"
    actions:
      - type: "wait"
        duration: 600
      - type: "click"
        target:
          role: "button"
          name: "Looks right"
    timing: "parallel"
    audioDuration: 2112
    videoDuration: 2114
  - id: "to-room"
    intent: "wait for the en route signpost (silent: the page load, that is Checking in..., the empty background and the skeleton, is cut from the video)"
    actions:
      - type: "press"
        key: "Shift"
        done:
          visible: "text=/look for/i >> nth=0"
          timeout: 60000
      - type: "wait"
        duration: 200
    timing: "parallel"
    audioDuration: 0
    videoDuration: 1046
  - id: "signpost"
    narration: "Then a signpost points to the first table, A12, and names the team to look for."
    intent: "the en route signpost to Table A12"
    actions:
      - type: "wait"
        duration: 4200
    timing: "parallel"
    audioDuration: 5112
    videoDuration: 5113
  - id: "floor-plan"
    narration: "The floor plan shows where that table is."
    intent: "open the floor plan sheet; the table is highlighted"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Floor plan"
        done:
          visible: "[role=dialog]"
          timeout: 60000
      - type: "wait"
        duration: 1300
    timing: "parallel"
    audioDuration: 2160
    videoDuration: 2731
  - id: "clock"
    narration: "And the clock at the top counts down the time left to judge."
    intent: "close the floor plan; the judging clock stays on screen at the top"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Close map"
        done:
          hidden: "[role=dialog]"
          timeout: 60000
      - type: "wait"
        duration: 2300
    timing: "parallel"
    audioDuration: 3408
    videoDuration: 3914
  - id: "at-table"
    narration: "At the table, the judge types the code printed on the placard."
    intent: "tap I'm at the table, type A14 into the placard field"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "at the table"
        done:
          text:
            selector: "main"
            has: "Are you NeuralMesh"
          timeout: 60000
      - type: "wait"
        duration: 100
      - type: "type"
        target:
          role: "textbox"
          name: "Placard code"
        text: "A14"
        delay: 220
      - type: "wait"
        duration: 500
    timing: "parallel"
    audioDuration: 3552
    videoDuration: 4047
  - id: "wrong-table"
    narration: "At the wrong table, Gav-IL says right away where the team really is."
    intent: "tap Check: the mismatch message naming LedgerLite and where NeuralMesh is"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Check"
        done:
          text:
            selector: "main"
            has: "A14 is LedgerLite"
          timeout: 60000
      - type: "wait"
        duration: 3600
    timing: "parallel"
    audioDuration: 4128
    videoDuration: 5062
  - id: "right-table"
    narration: "The right table code, plus the two characters after the dot, confirms it: right table, right team."
    intent: "type A12 K7, Check: matched"
    actions:
      - type: "type"
        target:
          role: "textbox"
          name: "Placard code"
        text: "A12 K7"
        delay: 200
      - type: "wait"
        duration: 500
      - type: "click"
        target:
          role: "button"
          name: "Check"
        done:
          text:
            selector: "main"
            has: "Checked by the placard code"
          timeout: 60000
      - type: "wait"
        duration: 1300
    timing: "parallel"
    audioDuration: 6216
    videoDuration: 6220
  - id: "ask-team"
    narration: "Table talk can take notes while the team demos, but only after everyone at the table says yes."
    intent: "tap Ask and record: the consent sheet opens"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Ask and record"
        done:
          visible: "[role=dialog]"
          timeout: 60000
      - type: "wait"
        duration: 2200
    timing: "parallel"
    audioDuration: 5208
    videoDuration: 5210
  - id: "consent"
    narration: "The sheet gives the judge a line to read out loud, and says who gets what. The audio is not kept."
    intent: "read the consent sheet, scroll it to the retention line, tap Everyone agreed; the recording screen then runs silent for 2 s, so that in the next segment the first 00:05 of the sample recording is over (and Mark this moment can be tapped) as the words one tap are said"
    actions:
      - type: "wait"
        duration: 1200
      - type: "scroll"
        target:
          text: "transcripts are deleted"
      - type: "wait"
        duration: 2200
      - type: "click"
        target:
          role: "button"
          name: "Everyone agreed"
        done:
          hidden: "[role=dialog]"
          timeout: 60000
      - type: "wait"
        duration: 2000
    timing: "parallel"
    audioDuration: 5568
    videoDuration: 7270
  - id: "recording"
    narration: "While the team talks, the phone listens, and the judge can mark a moment with one tap."
    intent: "the sample recording runs; once the clock reads 00:05 or later, mark a moment (a mark before 00:05 anchors to the greeting line and adds a junk Notable row)"
    actions:
      - type: "press"
        key: "Shift"
        done:
          visible: ".gv-rec__time:text-matches(\"^00:(0[5-9]|[1-5][0-9])$\")"
          timeout: 60000
      - type: "click"
        target:
          role: "button"
          name: "Mark this moment"
      - type: "wait"
        duration: 500
    timing: "parallel"
    audioDuration: 4848
    videoDuration: 5359
  - id: "pulling"
    narration: "When they stop, Gav-IL pulls out the highlights. It takes a few seconds."
    intent: "stop the recording; the Pulling out highlights spinner, then the list"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Stop recording"
        done:
          visible: "h2:has-text(\"From table talk\")"
          timeout: 60000
    timing: "parallel"
    audioDuration: 4464
    videoDuration: 4464
  - id: "keep"
    narration: "The judge keeps the highlights that are right, and they go into the notes."
    intent: "scroll the highlights, Keep all"
    actions:
      - type: "wait"
        duration: 1000
      - type: "click"
        target:
          role: "button"
          name: "Keep all"
        done:
          visible: "button:has-text(\"All kept\")"
          timeout: 60000
      - type: "wait"
        duration: 1200
    timing: "parallel"
    audioDuration: 3744
    videoDuration: 3746
  - id: "status"
    narration: "Next, the judge marks how the demo went."
    intent: "pick the demo status Ran live"
    actions:
      - type: "click"
        target:
          role: "radio"
          name: "Ran live"
        done:
          attribute:
            selector: "[role=radio]"
            name: "aria-checked"
            value: "true"
          timeout: 60000
      - type: "wait"
        duration: 600
    timing: "parallel"
    audioDuration: 2616
    videoDuration: 2619
