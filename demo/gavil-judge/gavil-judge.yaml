    intent: "tap the Memo - EcoLens cue above the signpost: the page scrolls down so the whole Memo card for EcoLens is in view (record button, START MEMO and the audio note; it is a real app card: Dictate a memo about EcoLens, only your voice), and hold it"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Memo · EcoLens"
        done:
          visible: "text=/start memo/i >> nth=0"
          timeout: 60000
      - type: "wait"
        duration: 3000
    timing: "parallel"
    audioDuration: 4368
    videoDuration: 4538
  - id: "tap-notes"
    narration: "Then they open My notes."
    intent: "tap My notes"
    actions:
      - type: "click"
        target:
          role: "link"
          name: "My notes"
    timing: "parallel"
    audioDuration: 1872
    videoDuration: 1873
  - id: "to-notes"
    intent: "wait for the My notes page (silent: the page load)"
    actions:
      - type: "press"
        key: "Shift"
        done:
          visible: "text=/highlights kept/i >> nth=0"
          url: "**/judge/notes**"
          timeout: 60000
      - type: "wait"
        duration: 300
    timing: "parallel"
    audioDuration: 0
    videoDuration: 325
