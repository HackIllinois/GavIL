    narration: "Then they submit."
    intent: "submit the evaluation"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Submit evaluation"
    timing: "parallel"
    audioDuration: 1872
    videoDuration: 1871
  - id: "to-next"
    intent: "wait for the Table A17 signpost to be drawn (silent: Sending... and the page swap, about 0.5 s on the current app)"
    actions:
      - type: "press"
        key: "Shift"
        done:
          visible: "text=/look for/i >> nth=0"
          timeout: 60000
      - type: "wait"
        duration: 150
    timing: "parallel"
    audioDuration: 0
    videoDuration: 299
  - id: "sent"
    narration: "The evaluation is saved, and the app points them to the next table."
    intent: "the signpost to Table A17 stays on screen; the app's own toast, Saved. Next table below., is up for 2.6 s from the moment the screen changes, so the word saved lands while it is visible"
    actions:
      - type: "wait"
        duration: 3300
    timing: "parallel"
    audioDuration: 4104
    videoDuration: 4106
  - id: "second-table"
    narration: "At the next table, it is the same placard check. The judge types the code, and the app confirms the team."
    intent: "tap I'm at the table, type A17 M3, Check; the confirmation is held for 1.7 s (the next segment's tap scrolls it away)"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "at the table"
        done:
          text:
            selector: "main"
            has: "Are you EcoLens"
          timeout: 60000
