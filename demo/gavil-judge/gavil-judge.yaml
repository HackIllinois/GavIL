    actions:
      - type: "press"
        key: "Shift"
        done:
          visible: "h1:has-text(\"Which was stronger\")"
          url: "**/judge/compare"
          timeout: 60000
      - type: "wait"
        duration: 200
    timing: "parallel"
    audioDuration: 0
    videoDuration: 212
  - id: "compare"
    narration: "The app opens the comparison of the last two projects. Recall rows bring back what they noted at each table."
    intent: "the compare screen (both cards fit on one screen, so nothing scrolls); as the recall rows are mentioned the disc points at the short EcoLens row, Water bottle worked., not at the first card's rows (the app clamps them to two lines)"
    actions:
      - type: "wait"
        duration: 2800
      - type: "hover"
        target:
          text: "Water bottle worked."
        text: "rest"
      - type: "wait"
        duration: 2300
    timing: "parallel"
    audioDuration: 6120
    videoDuration: 6189
  - id: "pick"
    narration: "They pick the stronger project, then tap Confirm."
    intent: "tap the radio circle of the NeuralMesh card (the whole card is the radio, so a tap on its middle would put the disc on the card's text), then Confirm: NeuralMesh; Vote recorded is up as the line ends"
    actions:
      - type: "click"
        target:
          selector: "[role=\"radio\"][aria-label^=\"NeuralMesh\"] .gv-compare__radio"
        done:
          visible: "button:has-text(\"Confirm: NeuralMesh\")"
          timeout: 60000
      - type: "click"
        target:
          role: "button"
          name: "Confirm: NeuralMesh"
        done:
          visible: "text=Vote recorded"
          timeout: 60000
    timing: "parallel"
    audioDuration: 2856
