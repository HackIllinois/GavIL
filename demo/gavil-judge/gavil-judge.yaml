    intent: "Partly ran, a short private note (typed key by key; the post-process never cuts inside this segment, see HOLDS in postcut.mjs)"
    actions:
      - type: "click"
        target:
          role: "radio"
          name: "Partly ran"
        done:
          attribute:
            selector: "[role=radio]"
            name: "aria-checked"
            value: "true"
