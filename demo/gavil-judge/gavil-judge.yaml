  - id: "undo"
    narration: "A pick can be undone for a few seconds, and the Undo button counts down."
    intent: "the Undo countdown runs (8 down to about 4 while the line plays; the line is short enough to be over before the count shows 3, so the silent count-wait that follows is a few tenths of a second)"
    actions:
      - type: "wait"
        duration: 500
    timing: "parallel"
    audioDuration: 4392
    videoDuration: 4395
  - id: "count-wait"
    intent: "silent: wait until the Undo count shows 3, so the next line starts at 3: its words run out and the vote is sent land on the count's last two seconds, 2 and 1, and the last word ends about 0.4 s before the screen goes to Sending your vote"
    actions:
      - type: "press"
        key: "Shift"
        done:
          visible: ".gv-recorded__secs:text-matches(\"^[(][0-3][)]$\")"
          timeout: 60000
    timing: "parallel"
    audioDuration: 0
    videoDuration: 804
  - id: "vote-sent"
    narration: "When the count runs out, the vote is sent."
    intent: "the count goes 3, 2, 1: runs out is said as it passes 2 and sent as it reads 1 (no word claims a 0, which is never on screen); the line is over before the screen changes (the Sending your vote ghost is cut in post)"
    actions:
      - type: "wait"
        duration: 300
    timing: "parallel"
    audioDuration: 2664
    videoDuration: 2665
  - id: "to-pocketlab"
