  - id: "nominate"
    narration: "If the project stands out, they nominate it for a prize."
    intent: "nominate for Most Creative"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Most Creative"
        done:
          visible: "button[aria-pressed=\"true\"]:has-text(\"Most Creative\")"
          timeout: 60000
      - type: "wait"
        duration: 1500
    timing: "parallel"
