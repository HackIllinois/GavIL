  - id: "no-record"
    narration: "This team says no to recording. The judge taps Not this time, and it does not affect judging."
    intent: "Ask and record, then Not this time; once the sheet is gone the real pointer is parked on the Judging ends in label in the header (a quiet hover: no disc, nothing under it reacts), so the Skip button below is not left hovered"
    actions:
      - type: "click"
        target:
          role: "button"
          name: "Ask and record"
        done:
